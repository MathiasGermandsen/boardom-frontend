services:
  boardom-frontend:
    build:
      context: ./Boardom
      dockerfile: Dockerfile
    ports:
      - "13000:13000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:13000
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ApiSettings__DatabaseApiUrl=${IP_ADDRESS_PORT}
      - ApiSettings__PowerApiUrl=${POWER_API_URL}
      - PowerApi__AdminKey=${POWER_API_ADMIN_KEY}
      - PowerApi__ServiceName=${POWER_API_SERVICE_NAME:-boardom-frontend}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__ClientId=${AUTH0_CLIENT_ID}
      - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - KIOSK_MODE=true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:13000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - boardom-network

networks:
  boardom-network:
    driver: bridge
