services:
  boardom-frontend:
    build:
      context: ./Boardom
      dockerfile: Dockerfile
    ports:
      - "13100:13100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:13100
      - ApiSettings__DatabaseApiUrl=${IP_ADDRESS_PORT}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__ClientId=${AUTH0_CLIENT_ID}
      - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - boardom-network

networks:
  boardom-network:
    driver: bridge